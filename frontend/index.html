<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1e2226">
  <script>(()=>{let mode;try{mode=localStorage.getItem('musicbot-theme')}catch{}if(mode!=='light'&&mode!=='dark')mode=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=mode;document.querySelector('meta[name="theme-color"]').content=mode==='light'?'#f3f5f7':'#1e2226'})()</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Music dashboard" data-i18n-content="m0223">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title data-i18n="m0223">Music dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
