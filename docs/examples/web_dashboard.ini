; Round 22 example. All external hostnames below are placeholders.
[WebDashboard]
Enabled = no
Host = localhost
Port = 8080
AuthMode = discord
PublicURL = https://music.example.invalid
DiscordClientID = REPLACE_WITH_CLIENT_ID
DiscordClientSecret = REPLACE_WITH_CLIENT_SECRET
SessionSecret = REPLACE_WITH_RANDOM_SECRET
DefaultLanguage = zh-TW
TimeZone = Asia/Taipei

; Total wall-clock seconds per resolution (1..120), including worker startup.
ResolveTimeoutSeconds = 20
; Maximum decoded bytes for any single provider response and metadata IPC.
ResolveMaxResponseBytes = 8388608
; Maximum cumulative decoded response bytes per resolution.
ResolveMaxTotalBytes = 33554432
