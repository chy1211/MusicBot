; Optional web dashboard. Copy to web_dashboard.ini only during deployment.
; Missing file / Enabled=no leaves the dashboard off; read once at startup.
[WebDashboard]
Enabled = no
Host = 127.0.0.1
Port = 8080
; owner preserves the previous OwnerID behavior and REQUIRES external SSO.
; discord authenticates each caller itself; SharedSecret is ignored in this mode.
AuthMode = owner
SharedSecret =
; Discord mode only: canonical root origin, HTTPS except local loopback demos.
; Register PublicURL + /auth/callback in the Discord Developer Portal.
PublicURL =
; Optional: blank uses the bot application ID.
DiscordClientID =
; OAuth2 Client Secret, NOT the bot token. Never commit actual credentials.
DiscordClientSecret =
; Optional random secret; blank generates a new key at startup.
; Persisted opaque sessions expire after 30 days of inactivity.
SessionSecret =
SessionHours = 168

; Dashboard UI (Discord replies keep the guild gettext language).
DefaultLanguage = en
TimeZone = UTC
