; Optional owner-only dashboard. Copy to web_dashboard.ini only when deploying.
; Missing file or Enabled = no leaves the dashboard disabled.
; Read once after Discord is ready; changing this file requires a bot restart.
[WebDashboard]
Enabled = no
; Use 0.0.0.0 only inside a protected container / trusted reverse proxy network.
Host = 127.0.0.1
Port = 8080
; Optional extra protection; use a long random value. Never put it in a URL.
; The browser sends it as Authorization: Bearer <value>, kept in tab memory only.
SharedSecret =
