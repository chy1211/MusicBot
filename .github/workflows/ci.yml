name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Pinned: Playwright in this repo does not support ubuntu-26.04 yet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libopus0 libsodium-dev libffi-dev
          python -m pip install -r requirements.txt
      - name: Build dashboard frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Backend unittest
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Frontend Node tests
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
        run: node --test tests/test_*.cjs
      - name: Dashboard browser regressions (desktop, tablet and mobile)
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
          PATCH1014_SHOTS: ${{ runner.temp }}/musicbot-dashboard-shots
        run: |
          python -m tools.dashboard_patch1014_fixture --port 18310 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18310/ >/dev/null; then ready=1; break; fi
            sleep 0.3
          done
          if [ "$ready" -ne 1 ]; then echo 'Demo fixture failed to start'; exit 1; fi
          node --test --test-concurrency=1 tools/test_dashboard_round15_browser.cjs tools/test_dashboard_round17_notice_browser.cjs tools/test_dashboard_round1819_browser.cjs
      - name: Compound YouTube links
        run: python -m tools.test_compound_link
      - name: Dashboard translation consistency
        run: python -m tools.check_dashboard_i18n
