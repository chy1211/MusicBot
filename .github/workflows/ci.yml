name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libopus0 libsodium-dev libffi-dev
          python -m pip install -r requirements.txt
      - name: Build dashboard frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Backend unittest
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Frontend Node tests
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
        run: node --test tests/test_*.cjs
      - name: Compound YouTube links
        run: python -m tools.test_compound_link
      - name: Dashboard translation consistency
        run: python -m tools.check_dashboard_i18n
