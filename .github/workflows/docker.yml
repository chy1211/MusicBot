name: Docker images
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly fresh dependencies, Sunday 04:15 UTC.
    - cron: '15 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
env:
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          persist-credentials: false
      - name: Set image and publication policy
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          BUILD_BRANCH: ${{ github.event_name == 'schedule' && 'dev' || github.head_ref || github.ref_name }}
          CAN_PUBLISH: ${{ github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          {
            echo "name=ghcr.io/${REPOSITORY_OWNER,,}/musicbot"
            echo "publish=$CAN_PUBLISH"
            echo "shortsha=$(git rev-parse --short=7 HEAD)"
            echo "sha=$(git rev-parse HEAD)"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "branch=$BUILD_BRANCH"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Tags and OCI metadata (local calculation only)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' || github.event_name == 'schedule' }}
            type=ref,event=tag
            type=raw,value=sha-${{ steps.image.outputs.shortsha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
      - name: Check digest gate helper regressions
        run: python3 -m unittest tools.test_ci_image_digest
      - name: Install OCI copy tool and start runner-local registry
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          mkdir -p "$RUNNER_TEMP/musicbot-registry"
          docker run -d --name musicbot-ci-registry \
            -p 127.0.0.1:5000:5000 \
            --mount "type=bind,src=$RUNNER_TEMP/musicbot-registry,dst=/var/lib/registry" \
            registry:2
          for attempt in {1..30}; do
            echo "Waiting for local registry ($attempt/30)"
            if curl -fsS http://127.0.0.1:5000/v2/; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build both platforms ONCE into an OCI archive (never push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BUILD_COMMIT=${{ steps.image.outputs.sha }}
            BUILD_TIME=${{ steps.image.outputs.time }}
            BUILD_BRANCH=${{ steps.image.outputs.branch }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/musicbot-candidate.tar
          push: false
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=musicbot-multiarch
          cache-to: type=gha,scope=musicbot-multiarch,mode=max
      - name: Stage archive without changing its digest
        id: candidate
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 tools/ci_image_digest.py stage \
            "$RUNNER_TEMP/musicbot-candidate.tar" "$BUILD_DIGEST" localhost:5000/musicbot
      - name: Required amd64 smoke tests and informational YouTube test
        env:
          CANDIDATE: ${{ steps.candidate.outputs.reference }}
        run: |
          docker pull --platform linux/amd64 "$CANDIDATE"
          python3 tools/smoke_test_image.py "$CANDIDATE" --platform linux/amd64
      - name: Required arm64 checks under QEMU
        env:
          CANDIDATE: ${{ steps.candidate.outputs.reference }}
        run: |
          docker pull --platform linux/arm64 "$CANDIDATE"
          python3 tools/smoke_test_image.py "$CANDIDATE" --platform linux/arm64 --basic-only
      - name: Record the digest that passed BOTH gates
        id: tested
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          echo "TESTED_DIGEST=$CANDIDATE_DIGEST"
          echo "digest=$CANDIDATE_DIGEST" >> "$GITHUB_OUTPUT"
      # No external registry login or publication until BOTH gates pass.
      - uses: docker/login-action@v4
        if: steps.image.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested index and verify every official tag (NO build)
        if: steps.image.outputs.publish == 'true'
        id: publish
        env:
          CANDIDATE: ${{ steps.candidate.outputs.reference }}
          TESTED_DIGEST: ${{ steps.tested.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python3 tools/ci_image_digest.py publish \
            "$CANDIDATE" "$TESTED_DIGEST" "$IMAGE_REPOSITORY" \
            --authfile "$HOME/.docker/config.json"
      - name: Record gate outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
          CAN_PUBLISH: ${{ steps.image.outputs.publish }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          TESTED_DIGEST: ${{ steps.tested.outputs.digest }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '### Image publication gate'
            echo "Job result: $RESULT; publication allowed by ref policy: $CAN_PUBLISH."
            echo "Build digest: ${BUILD_DIGEST:-unavailable}"
            echo "Tested digest: ${TESTED_DIGEST:-required gates did not both pass}"
            echo "Published digest (all official tags): ${PUBLISHED_DIGEST:-not published or verification failed}"
            echo 'Required: amd64 startup/import/tools/public audio and arm64 offline checks.'
            echo 'YouTube: informational; datacenter IP blocking does not prevent publication.'
            echo 'Required gate failures skip publication. Digest/copy failures fail the job.'
            echo 'Only a runner-local ci tag is used; no temporary ghcr tag is created.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$PUBLISHED_DIGEST" && "$TESTED_DIGEST" != "$PUBLISHED_DIGEST" ]]; then
            echo '::error::Published digest differs from tested digest'
            exit 1
          fi
      - name: Remove runner-local candidate storage
        if: always()
        env:
          CANDIDATE: ${{ steps.candidate.outputs.reference }}
        run: |
          if [[ -n "$CANDIDATE" ]]; then
            docker image rm "$CANDIDATE" >/dev/null 2>&1 || true
          fi
          docker rm -fv musicbot-ci-registry >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/musicbot-candidate.tar"
          sudo rm -rf -- "$RUNNER_TEMP/musicbot-registry"
