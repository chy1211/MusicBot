name: Docker images
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly fresh dependencies, Sunday 04:15 UTC.
    - cron: '15 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
env:
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          persist-credentials: false
      - name: Set image and publication policy
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          CAN_PUBLISH: ${{ github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          echo "name=ghcr.io/${REPOSITORY_OWNER,,}/musicbot" >> "$GITHUB_OUTPUT"
          echo "publish=$CAN_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "shortsha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build and load amd64 candidate (never push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: musicbot-webtest-amd64:ci
          cache-from: type=gha,scope=musicbot-amd64
          cache-to: type=gha,scope=musicbot-amd64,mode=max
      - name: Required amd64 smoke tests and informational YouTube test
        run: python3 tools/smoke_test_image.py musicbot-webtest-amd64:ci --platform linux/amd64
      - name: Build and load arm64 candidate (never push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: musicbot-webtest-arm64:ci
          cache-from: type=gha,scope=musicbot-arm64
          cache-to: type=gha,scope=musicbot-arm64,mode=max
      - name: Required arm64 checks under QEMU
        run: python3 tools/smoke_test_image.py musicbot-webtest-arm64:ci --platform linux/arm64 --basic-only
      # No registry login, metadata publication or push until BOTH gates pass.
      - uses: docker/login-action@v4
        if: steps.image.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and OCI metadata
        if: steps.image.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' || github.event_name == 'schedule' }}
            type=ref,event=tag
            type=raw,value=sha-${{ steps.image.outputs.shortsha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
      - name: Publish tested amd64 and arm64 layers
        if: steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Scheduled candidates already refreshed all layers with no-cache.
          # Reuse exactly those layers here instead of resolving dependencies again.
          pull: false
          no-cache: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=musicbot-amd64
            type=gha,scope=musicbot-arm64
      - name: Record gate outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
          CAN_PUBLISH: ${{ steps.image.outputs.publish }}
        run: |
          {
            echo '### Image publication gate'
            echo "Job result: $RESULT; publication allowed by ref policy: $CAN_PUBLISH."
            echo 'Required: amd64 startup/import/tools/public audio and arm64 offline checks.'
            echo 'YouTube: informational; datacenter IP blocking does not prevent publication.'
            echo 'Any required failure skips publication and leaves registry tags unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove candidate images
        if: always()
        run: docker image rm musicbot-webtest-amd64:ci musicbot-webtest-arm64:ci >/dev/null 2>&1 || true
